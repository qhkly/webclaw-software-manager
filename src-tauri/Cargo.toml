[package]
name = "webclaw-software-manager"
version = "0.1.0"
edition = "2021"

[lib]
name = "webclaw_software_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
regex = "1"
anyhow = "1"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
# 登录回调验签。刻意不用 openssl：CI 要出 macOS×2 / Linux×2 / Windows 五种产物，
# 纯 Rust 实现省掉交叉编译时的系统库依赖。
rsa = "0.9"
# oid：Pkcs1v15Sign::new::<Sha256> 需要摘要算法的 OID 才能拼出 PKCS#1 v1.5 的 DigestInfo
sha2 = { version = "0.10", features = ["oid"] }
base64 = "0.22"
rand = "0.8"
