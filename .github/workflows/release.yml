          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build (x64)
        run: npm run build -- --target x86_64-apple-darwin --bundles app

      - name: Archive app bundle
        shell: bash
        run: |
          version=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          ditto -c -k --sequesterRsrc --keepParent \
            "src-tauri/target/x86_64-apple-darwin/release/bundle/macos/Webclaw Software Manager.app" \
            "src-tauri/target/x86_64-apple-darwin/release/bundle/macos/Webclaw Software Manager_${version}_x64.app.zip"

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.zip
          generate_release_notes: true

  build-linux-x64:
    name: Linux (x64)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Sync version from tag
