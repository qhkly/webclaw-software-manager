              p = pathlib.Path(fp)
              p.write_text(re.sub(r'"version":\s*"[^"]+"', f'"version": "{ver}"', p.read_text(encoding='utf-8'), count=1), encoding='utf-8')
          p = pathlib.Path('src-tauri/Cargo.toml')
          p.write_text(re.sub(r'(?m)^version = "[^"]+"', f'version = "{ver}"', p.read_text(encoding='utf-8'), count=1), encoding='utf-8')
          print(f"Synced to {ver}")
          PYEOF

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          generate_release_notes: true

