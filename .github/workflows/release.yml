name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos-arm64:
    name: macOS (arm64)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          VER: ${{ github.ref_name }}
        run: |
          python3 - <<'PYEOF'
          import os, re, pathlib
          ver = os.environ['VER'].lstrip('v')
          for fp in ['package.json', 'src-tauri/tauri.conf.json']:
              p = pathlib.Path(fp)
              p.write_text(re.sub(r'"version":\s*"[^"]+"', f'"version": "{ver}"', p.read_text(encoding='utf-8'), count=1), encoding='utf-8')
          p = pathlib.Path('src-tauri/Cargo.toml')
          p.write_text(re.sub(r'(?m)^version = "[^"]+"', f'version = "{ver}"', p.read_text(encoding='utf-8'), count=1), encoding='utf-8')
          print(f"Synced to {ver}")
          PYEOF

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build (arm64)
        run: npm run build -- --target aarch64-apple-darwin --bundles app

      - name: Archive app bundle
        shell: bash
        run: |
          version=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          ditto -c -k --sequesterRsrc --keepParent \
            "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Webclaw Software Manager.app" \
            "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Webclaw Software Manager_${version}_arm64.app.zip"

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.zip
          generate_release_notes: true

  build-macos-x64:
    name: macOS (x64 Intel)
    runs-on: macos-15-intel  # Intel x64 runner (macos-13 已废弃)
    permissions:
